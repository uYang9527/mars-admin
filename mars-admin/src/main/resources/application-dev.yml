server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mars_admin?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      # 连接池配置
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      # 监控统计拦截的filters
      filter:
        stat:
          enabled: true
          db-type: mysql
          log-slow-sql: true
          slow-sql-millis: 500
        wall:
          enabled: true
          db-type: mysql
          config:
            multi-statement-allow: true
            # StatViewServlet配置
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: true
        login-username: admin
        login-password: marsadmin
        allow: ""
      # WebStatFilter配置
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
        session-stat-enable: true
      # Spring监控配置
      aop-patterns: com.mars.admin.service.*

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 异步任务配置 - 开发环境
  task:
    execution:
      pool:
        # 操作日志异步任务线程池配置
        operation-log:
          core-size: 2
          max-size: 4
          queue-capacity: 1000
          keep-alive: 60s
          thread-name-prefix: "operation-log-"
          allow-core-thread-timeout: true
      shutdown:
        await-termination: true
        await-termination-period: 30s

# SpringDoc OpenAPI 3 配置 (替代Swagger 2)
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true

# Knife4j配置 (OpenAPI 3 版本)
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
  production: false



# MyBatis-Flex 配置
mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

# 日志配置
logging:
  level:
    com.mars.admin: debug
    com.mars.admin.framework.listener: debug
    com.mars.admin.framework.config: info
    # 异步操作日志相关 - 开发环境可开启DEBUG
    com.mars.admin.framework.aspect.OperationLogAspect: DEBUG
    com.mars.admin.framework.service.AsyncOperationLogService: DEBUG
    com.mybatisflex: debug
    org.springframework.jdbc: debug
    root: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  
  # 异步日志相关的日志文件配置 - 开发环境
  logback:
    rollingpolicy:
      # 操作日志文件大小
      max-file-size: 50MB
      # 保留天数
      max-history: 7

# SaToken配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: true
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true
  # 是否尝试从cookie里读取token
  is-read-cookie: false
  # 是否尝试从header里读取token
  is-read-header: true
  # token前缀
  token-prefix: Bearer

  exclude-paths:
    # 认证相关接口
    - /auth/**
    # 静态资源
    - /static/**
    - /public/**
    - /webjars/**
    - /favicon.ico
    # API文档相关
    - /doc.html
    - /swagger-ui.html
    - /swagger-ui/**
    - /swagger-resources/**
    - /v2/api-docs
    - /v3/api-docs
    - /v3/api-docs/**
    - /knife4j/**
    # 健康检查
    - /actuator/**
    - /health
    # 错误页面
    - /error
    # 测试接口
    - /test/**
    # SQL日志页面相关
    - /sqlLog.html
    - /sqlLog/**
    - /sql-log/**
    # 文件上传
    - /file/upload
    - /druid/**
# SQL日志页面配置
sql-log:
  username: admin
  password: admin

# 文件上传配置
file:
  upload:
    path: ./upload  # 本地上传路径
    default-config: minio  # 默认使用的配置类型
    max-size: 10485760  # 最大文件大小(10MB)
    allowed-types: jpg,jpeg,png,gif,bmp,doc,docx,xls,xlsx,ppt,pptx,pdf,txt,zip,rar  # 允许的文件类型

# Spring文件上传配置已在主spring节点中配置
