# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        listen [::]:80;
        server_name mashang-dian.com www.mashang-dian.com;

        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name mars666.tech;
        return 301 https://www.mars666.tech$request_uri;

    }


    server {
            listen 80;
            listen [::]:80;
            server_name mars666.xn--fiqs8s www.mars666.xn--fiqs8s mars666.中国 www.mars666.中国;
            return 301 https://$host$request_uri;
        }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name mashang-dian.com www.mashang-dian.com;

        root /usr/local/mashangdian/web/;
        index index.html index.htm;

        ssl_certificate     /etc/nginx/ssl/www.mashang-dian.com.pem;
        ssl_certificate_key /etc/nginx/ssl/www.mashang-dian.com.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            try_files $uri $uri/ =404;
        }

        # 可选：加载默认配置（如 gzip、跨域、header）
        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }


