    # HTTPS 配置，反向代理到本地 8080 端口后台接口
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.mashang-dian.com;

        ssl_certificate     /etc/nginx/ssl/api.mashang-dian.com.pem;
        ssl_certificate_key /etc/nginx/ssl/api.mashang-dian.com.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://127.0.0.1:8080;  # 后端接口地址
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # 可根据需求添加超时和缓冲区配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
        location /api {
                    proxy_pass         http://127.0.0.1:3000;  # 后端接口地址
                    proxy_set_header   Host $host;
                    proxy_set_header   X-Real-IP $remote_addr;
                    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header   X-Forwarded-Proto $scheme;

                    # 可根据需求添加超时和缓冲区配置
                    proxy_connect_timeout 60s;
                    proxy_send_timeout 60s;
                    proxy_read_timeout 60s;
                    proxy_buffering off;
                }

        # 可选：加载默认配置（gzip、header等）
        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }


