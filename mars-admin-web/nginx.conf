    server {
                listen 443 ssl;
                listen [::]:443 ssl;

                server_name www.marsadmin.cn;

                root /usr/local/marsadmin/mars-admin-official/;
                index index.html index.htm;

                ssl_certificate     /etc/letsencrypt/live/www.marsadmin.cn/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/www.marsadmin.cn/privkey.pem;

                ssl_protocols       TLSv1.2 TLSv1.3;
                ssl_ciphers         HIGH:!aNULL:!MD5;

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location ~ ^/.well-known/acme-challenge/ {
                    allow all;
                    root /var/www/html;
                }

                # 可选：加载默认配置（如 gzip、跨域、header）
                include /etc/nginx/default.d/*.conf;

                error_page 404 /404.html;
                location = /40x.html {
                }

                error_page 500 502 503 504 /50x.html;
                location = /50x.html {
                }
            }



